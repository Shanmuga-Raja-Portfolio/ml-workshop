name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stdlib-only gate: scrub greps, clean notebooks, manifest validity,
      # and generators reproduce the committed notebooks byte-for-byte.
      - run: python tools/check_repo.py --regen-check

  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The committed pyproject stays platform-neutral; Linux runners need the
      # CPU torch index or uv resolves the CUDA wheels (proprietary NVIDIA
      # licenses the audit rightfully rejects). Same block bootstrap.py writes.
      - name: Pin CPU torch for the Linux runner
        run: |
          cat >> pyproject.toml <<'EOF'

          # --- BEGIN machine-local PyTorch config (generated by tools/bootstrap.py; do not commit) ---
          [[tool.uv.index]]
          name = "pytorch-cpu"
          url = "https://download.pytorch.org/whl/cpu"
          explicit = true

          [tool.uv.sources]
          torch = [{ index = "pytorch-cpu" }]
          torchvision = [{ index = "pytorch-cpu" }]
          # --- END machine-local PyTorch config ---
          EOF
      - name: Sync environment (CPU torch on Linux runners)
        run: uv sync
      - name: Every dependency must be permissively licensed
        run: uv run python tools/license_audit.py
